<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travelogue — Connect with Travelers in Real Time</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
        }

        p {
            font-size: 1.4rem;
            opacity: 0.9;
        }

        input {
            padding: 1rem;
            width: 300px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            margin: 1rem;
        }

        button {
            padding: 1rem 2rem;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #059669;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Travelogue</h1>
        <img src="images/fav_logo.jpeg" alt="Travelogue Logo" width="150" />
        <p>Connect with real travelers in real time — like Uber for travel buddies & local guides.</p>
        <p>Launching soon in 2026</p>
        <form action="https://formspree.io/f/your-form-id" method="POST">
            <input type="email" name="email" placeholder="Enter your email" required />
            <button type="submit">Get Early Access</button>
        </form>
        <p style="font-size:0.9rem; margin-top:2rem;">© 2025 Travelogue LLC</p>
    </div>
</body>

</html>
